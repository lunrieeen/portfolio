<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b20">
<title>Home | Personal Portfolio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- SPACE BACKGROUND -->
<canvas id="space" aria-hidden="true"></canvas>
<div class="nebula"></div>
<div class="cursor-glow" id="glow"></div>

<div class="site">

<header>
    <a href="index.html" class="logo">PORTFOLIO</a>
    <div class="header-line"></div>

    <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" class="nav-link active" aria-current="page">HOME</a>
        <a href="personinfo.html" class="nav-link">PERSONAL INFO</a>
        <a href="achievements.html" class="nav-link">ACHIEVEMENTS</a>
        <a href="acknowledgements.html" class="nav-link">ACKNOWLEDGEMENTS</a>
    </nav>
</header>

<main class="profile-home">

    <!-- LEFT PHOTO AREA -->
    <section class="photo-panel" aria-label="Profile photo">
        <div class="photo-orbit orbit-one"></div>
        <div class="photo-orbit orbit-two"></div>
        <div class="moon-symbol" aria-hidden="true">☾</div>

        <div class="photo-wrap">
            <img src="imgs/profile.jpg" alt="Charmaine Bognadon" class="photo-preview">
        </div>

        <div class="photo-stars star-one" aria-hidden="true">✦</div>
        <div class="photo-stars star-two" aria-hidden="true">✧</div>
        <div class="photo-stars star-three" aria-hidden="true">✦</div>
        <div class="photo-stars star-four" aria-hidden="true">·</div>
    </section>

    <!-- RIGHT CONTENT AREA -->
    <section class="content-panel">

        <a href="personinfo.html" class="constellation constellation-info">
            <span class="constellation-label">PERSONAL INFO</span>
            <svg viewBox="0 0 180 100" aria-hidden="true">
                <line x1="20" y1="75" x2="55" y2="35"/>
                <line x1="55" y1="35" x2="100" y2="60"/>
                <line x1="100" y1="60" x2="140" y2="25"/>
                <line x1="140" y1="25" x2="160" y2="65"/>
                <circle cx="20" cy="75" r="3"/>
                <circle cx="55" cy="35" r="4"/>
                <circle cx="100" cy="60" r="3"/>
                <circle cx="140" cy="25" r="4"/>
                <circle cx="160" cy="65" r="3"/>
            </svg>
        </a>

        <a href="achievements.html" class="constellation constellation-achievements">
            <span class="constellation-label">ACHIEVEMENTS</span>
            <svg viewBox="0 0 180 100" aria-hidden="true">
                <line x1="15" y1="55" x2="45" y2="25"/>
                <line x1="45" y1="25" x2="85" y2="50"/>
                <line x1="85" y1="50" x2="125" y2="20"/>
                <line x1="125" y1="20" x2="160" y2="55"/>
                <circle cx="15" cy="55" r="3"/>
                <circle cx="45" cy="25" r="4"/>
                <circle cx="85" cy="50" r="3"/>
                <circle cx="125" cy="20" r="4"/>
                <circle cx="160" cy="55" r="3"/>
            </svg>
        </a>

        <div class="intro">
            <p class="eyebrow">WELCOME TO MY PORTFOLIO</p>
            <h1 class="profile-name">Charmaine Bognadon</h1>
            <p class="profile-bio">
                Hello! I’m a Data Science student at 
                the University of the Cordilleras with an interest in programming and technology.
            </p>
            <div class="intro-line"></div>
        </div>

        <a href="index.html" class="constellation constellation-home">
            <span class="constellation-label">HOME</span>
            <svg viewBox="0 0 180 100" aria-hidden="true">
                <line x1="20" y1="60" x2="50" y2="25"/>
                <line x1="50" y1="25" x2="90" y2="50"/>
                <line x1="90" y1="50" x2="125" y2="30"/>
                <line x1="125" y1="30" x2="160" y2="70"/>
                <circle cx="20" cy="60" r="3"/>
                <circle cx="50" cy="25" r="4"/>
                <circle cx="90" cy="50" r="3"/>
                <circle cx="125" cy="30" r="4"/>
                <circle cx="160" cy="70" r="3"/>
            </svg>
        </a>

        <a href="acknowledgements.html" class="constellation constellation-ack">
            <span class="constellation-label">ACKNOWLEDGEMENTS</span>
            <svg viewBox="0 0 180 100" aria-hidden="true">
                <line x1="15" y1="40" x2="45" y2="70"/>
                <line x1="45" y1="70" x2="85" y2="30"/>
                <line x1="85" y1="30" x2="125" y2="65"/>
                <line x1="125" y1="65" x2="160" y2="35"/>
                <circle cx="15" cy="40" r="3"/>
                <circle cx="45" cy="70" r="4"/>
                <circle cx="85" cy="30" r="3"/>
                <circle cx="125" cy="65" r="4"/>
                <circle cx="160" cy="35" r="3"/>
            </svg>
        </a>

    </section>
</main>
</div>

<script src="js/script.js"></script>
</body>
</html>
